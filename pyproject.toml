[project]
name = "convertible-bond"
version = "0.1.1"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "chinese-calendar>=1.11.0",
    "duckdb>=1.4.3",
    "environs>=14.5.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pandas-stubs==2.3.3.251219",
    "pycryptodomex>=3.23.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "scipy>=1.1.0",
    "toml>=0.10.2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "iFinD", "utils"]
